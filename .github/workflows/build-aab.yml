name: Build & Release Android (AAB & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (AAB) & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Restore Firebase config files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          # Use repository file if present, otherwise restore from secret
          if [ ! -s "android/app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            else
              echo "Missing google-services.json" && exit 1
            fi
          fi
          if [ ! -s "lib/firebase_options.dart" ]; then
            if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
              echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
            else
              echo "Missing firebase_options.dart" && exit 1
            fi
          fi

      - name: Decode & Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=${KEYSTORE_PASSWORD}" > android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ANDROID_APP_ID="ca-app-pub-4674211063760769~4701909672" \
            --dart-define=ANDROID_BANNER_AD_ID="ca-app-pub-4674211063760769/8014468725" \
            --dart-define=ANDROID_LEADERBOARD_BANNER_AD_ID="ca-app-pub-4674211063760769/1863993345" \
            --dart-define=ANDROID_INTERSTITIAL_AD_ID="ca-app-pub-4674211063760769/2075746330" \
            --dart-define=ANDROID_REWARDED_AD_ID="ca-app-pub-4674211063760769/7822897035"

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ANDROID_APP_ID="ca-app-pub-4674211063760769~4701909672" \
            --dart-define=ANDROID_BANNER_AD_ID="ca-app-pub-4674211063760769/8014468725" \
            --dart-define=ANDROID_LEADERBOARD_BANNER_AD_ID="ca-app-pub-4674211063760769/1863993345" \
            --dart-define=ANDROID_INTERSTITIAL_AD_ID="ca-app-pub-4674211063760769/2075746330" \
            --dart-define=ANDROID_REWARDED_AD_ID="ca-app-pub-4674211063760769/7822897035"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-brain-mini-games-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-brain-mini-games-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
